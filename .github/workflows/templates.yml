name: Template

# Generate the project template, build it against this commit and check that
# it serves / under wrangler dev: what `nix flake init -t github:Ojoxux/workers-hs`
# gives a new project. Run by hand, before a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          # try-template.sh has cabal clone this checkout at HEAD.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Cache the wasm cabal store
        uses: actions/cache@v4
        with:
          path: ~/.ghc-wasm/.cabal
          key: wasm-cabal-${{ hashFiles('flake.lock', 'workers-hs.project', 'haskell/**/*.cabal') }}
          restore-keys: wasm-cabal-
      - name: Generate, build and serve
        run: scripts/try-template.sh "$RUNNER_TEMP/template"
