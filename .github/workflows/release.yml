name: Release

# Every push to main whose commits since the last release hold a feat, fix,
# perf or breaking change becomes the next release (scripts/next-version.mjs):
# a commit off main with the version filled in (scripts/fill-version.mjs),
# tagged, and a GitHub Release with generated notes. main itself never carries
# a version. See docs/releasing.md.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # next-version.mjs reads the tags and the commits since the last one.
          fetch-depth: 0
      - name: Next version
        id: version
        run: echo "tag=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Commit the release off main and tag it
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          node scripts/fill-version.mjs "$TAG"
          git commit -am "chore: release $TAG"
          git tag "$TAG"
          git push origin "$TAG"
      # For the latest tag, not only a new one: a run that pushed its tag but
      # failed before this step is finished by a rerun or the next push.
      - name: GitHub Release for the latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          [ -n "$tag" ] || exit 0
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes --title "$tag"
